<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Rashidi Import &amp; Export — Industrial &amp; Plastic Machinery</title>
    <meta
      name="description"
      content="Import, export and supply of plastic processing machinery and heavy industrial equipment. Injection molding, blow molding, extrusion, recycling lines and auxiliary equipment."
    />

    <base href="/" />

    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <!--
      Applies the remembered theme before the first paint. This runs ahead of
      the stylesheet and of Angular; without it a returning dark-mode visitor
      sees a white flash for as long as the bundle takes to boot.
      Light is the default, matching ThemeService.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('rashidi.theme');
          var theme = stored === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.style.setProperty('--boot-bg', '#0b1220');
            document.documentElement.style.setProperty('--boot-track', 'rgba(255,255,255,0.12)');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0b1220');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!-- Open Graph / Twitter defaults. The SeoService overrides these per route. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rashidi Import &amp; Export" />
    <meta property="og:title" content="Rashidi Import &amp; Export — Industrial &amp; Plastic Machinery" />
    <meta
      property="og:description"
      content="Industrial and plastic machinery, sourced, inspected and commissioned for manufacturers across the region."
    />
    <meta property="og:image" content="og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: two Latin faces and one Arabic face, subset to the weights used. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <style>
      /*
       * Pre-boot paint. Angular has not loaded yet at this point, so this block
       * is what the visitor actually sees for the first few hundred milliseconds.
       * It paints the same ground colour as the app to avoid a white flash, and
       * draws a minimal mark so the wait reads as intentional.
       */
      /* Set by the boot script above for dark; light is the default. */
      html,
      body {
        margin: 0;
        background: var(--boot-bg, #ffffff);
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: var(--boot-bg, #ffffff);
        transition: opacity 340ms ease, visibility 340ms ease;
      }

      #boot[hidden-boot] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #boot .mark {
        width: 46px;
        height: 46px;
        border: 2px solid var(--boot-track, rgba(17, 24, 39, 0.12));
        border-top-color: #007bff;
        border-radius: 50%;
        animation: boot-spin 720ms linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot .mark {
          animation: none;
          border-top-color: var(--boot-track, rgba(17, 24, 39, 0.12));
        }
      }
    </style>
  </head>

  <body>
    <!-- Replaced by the Angular intro component the moment the app bootstraps. -->
    <div id="boot" aria-hidden="true"><div class="mark"></div></div>

    <app-root></app-root>
  </body>
</html>
